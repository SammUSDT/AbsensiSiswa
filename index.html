<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Absensi Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0e1a;
--card:rgba(20,25,40,.7);
--border:rgba(255,255,255,.06);
--primary:#6366f1;
--primary2:#8b5cf6;
--success:#10b981;
--warning:#f59e0b;
--danger:#ef4444;
--text:#fff;
--text-dim:#888;
}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.15),transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-30%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(139,92,246,.12),transparent 70%);border-radius:50%;pointer-events:none;z-index:0}

.container{max-width:720px;margin:0 auto;position:relative;z-index:1}

.header{text-align:center;margin-bottom:28px}
.header .logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);font-size:30px;margin-bottom:14px;box-shadow:0 10px 40px rgba(99,102,241,.4);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.header h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.header p{font-size:13px;color:var(--text-dim);margin-top:6px}

.clock-card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.clock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899)}
.clock-card .time{font-size:42px;font-weight:800;background:linear-gradient(135deg,#a5b4fc,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;font-variant-numeric:tabular-nums}
.clock-card .date{font-size:13px;color:var(--text-dim);margin-top:4px;letter-spacing:1px}
.clock-card .wib{font-size:11px;color:#6366f1;margin-top:6px;letter-spacing:2px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:16px 10px;text-align:center;transition:.3s}
.stat:hover{transform:translateY(-2px);border-color:rgba(99,102,241,.2)}
.stat .num{font-size:24px;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .lbl{font-size:10px;color:var(--text-dim);margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.stat.hadir .num{background:linear-gradient(135deg,#10b981,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat.izin .num{background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat.sakit .num{background:linear-gradient(135deg,#ef4444,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#fff}
.card h2 .icon{font-size:18px}

.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:11px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.input-group input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;font-size:14px;outline:none;transition:.3s}
.input-group input:focus{border-color:rgba(99,102,241,.4);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.input-group input::placeholder{color:#444}

.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.status-option{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;transition:.25s;user-select:none}
.status-option:hover{border-color:rgba(99,102,241,.3);transform:translateY(-2px)}
.status-option .icon{font-size:24px;margin-bottom:6px}
.status-option .label{font-size:11px;color:var(--text-dim);font-weight:600}
.status-option.selected{border-color:var(--primary);background:rgba(99,102,241,.1);box-shadow:0 0 20px rgba(99,102,241,.2)}
.status-option.selected .label{color:#a5b4fc}
.status-option.hadir.selected{border-color:#10b981;background:rgba(16,185,129,.1);box-shadow:0 0 20px rgba(16,185,129,.2)}
.status-option.hadir.selected .label{color:#4ade80}
.status-option.izin.selected{border-color:#f59e0b;background:rgba(245,158,11,.1);box-shadow:0 0 20px rgba(245,158,11,.2)}
.status-option.izin.selected .label{color:#fbbf24}
.status-option.sakit.selected{border-color:#ef4444;background:rgba(239,68,68,.1);box-shadow:0 0 20px rgba(239,68,68,.2)}
.status-option.sakit.selected .label{color:#f87171}

.btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:1px;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(99,102,241,.4)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.loading-spinner{width:60px;height:60px;border:4px solid rgba(99,102,241,.1);border-top:4px solid #6366f1;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#6366f1;font-weight:700;letter-spacing:3px;text-transform:uppercase}

.record{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;animation:fadeIn .3s ease;transition:.2s}
.record:hover{border-color:rgba(99,102,241,.2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.record .left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.record .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.record .info{min-width:0;flex:1}
.record .info .name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record .info .meta{font-size:11px;color:var(--text-dim);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.record .info .meta .date{color:#6366f1}
.record .info .meta .time{color:#8b5cf6}
.record .badge{font-size:10px;padding:4px 12px;border-radius:20px;font-weight:700;letter-spacing:.5px;flex-shrink:0}
.badge.hadir{background:rgba(16,185,129,.15);color:#4ade80;border:1px solid rgba(16,185,129,.3)}
.badge.izin{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.badge.sakit{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}

.empty{text-align:center;padding:40px 20px;color:#444}
.empty .icon{font-size:48px;opacity:.3;margin-bottom:12px}
.empty .text{font-size:13px}

.actions{display:flex;gap:10px;margin-top:12px}
.btn-outline{flex:1;padding:12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:.3s;letter-spacing:1px}
.btn-outline:hover{border-color:var(--primary);color:#a5b4fc}
.btn-outline.danger:hover{border-color:var(--danger);color:#f87171}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,.95);color:#fff;padding:14px 28px;border-radius:60px;font-size:13px;font-weight:600;display:none;z-index:300;box-shadow:0 10px 40px rgba(16,185,129,.3);max-width:90%;text-align:center}
.toast.error{background:rgba(239,68,68,.95);box-shadow:0 10px 40px rgba(239,68,68,.3)}
.toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.footer{text-align:center;font-size:11px;color:#333;padding:20px 0 40px;letter-spacing:1px}

@media (max-width:480px){
    .header h1{font-size:24px}
    .clock-card .time{font-size:32px}
    .stats{gap:8px}
    .stat .num{font-size:20px}
    .status-grid{gap:8px}
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">📚</div>
        <h1>Absensi Siswa</h1>
        <p>Isi kehadiran kamu hari ini</p>
    </div>

    <div class="clock-card">
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date">-</div>
        <div class="wib">WAKTU INDONESIA BARAT (WIB)</div>
    </div>

    <div class="stats">
        <div class="stat hadir"><div class="num" id="statHadir">0</div><div class="lbl">Hadir</div></div>
        <div class="stat izin"><div class="num" id="statIzin">0</div><div class="lbl">Izin</div></div>
        <div class="stat sakit"><div class="num" id="statSakit">0</div><div class="lbl">Sakit</div></div>
    </div>

    <div class="card">
        <h2><span class="icon">✍️</span> Form Kehadiran</h2>

        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu..." autocomplete="off" maxlength="50">
        </div>

        <div class="input-group">
            <label>Status Kehadiran</label>
            <div class="status-grid">
                <div class="status-option hadir" data-status="hadir" onclick="selectStatus(this)">
                    <div class="icon">✅</div>
                    <div class="label">Hadir</div>
                </div>
                <div class="status-option izin" data-status="izin" onclick="selectStatus(this)">
                    <div class="icon">📝</div>
                    <div class="label">Izin</div>
                </div>
                <div class="status-option sakit" data-status="sakit" onclick="selectStatus(this)">
                    <div class="icon">🤒</div>
                    <div class="label">Sakit</div>
                </div>
            </div>
        </div>

        <button class="btn" id="btnKirim" onclick="submitAbsen()">
            📤 Kirim Kehadiran
        </button>
    </div>

    <div class="card">
        <h2><span class="icon">📋</span> Daftar Hadir Hari Ini</h2>
        <div id="records"></div>

        <div class="actions">
            <button class="btn-outline" onclick="exportCSV()">📥 Export CSV</button>
            <button class="btn-outline danger" onclick="clearAll()">🗑️ Hapus Semua</button>
        </div>
    </div>

    <div class="footer">
        Absensi Siswa • Data tersimpan di browser kamu
    </div>

</div>

<div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Mengirim...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMAILJS_PUBLIC_KEY = 'uT3kJwHbXV0cUlULq'
const EMAILJS_SERVICE_ID = 'service_h4z0qtq'
const EMAILJS_TEMPLATE_ID = 'template_6zle026'
const TARGET_EMAIL = 'bayuxdebb@gmail.com'

emailjs.init(EMAILJS_PUBLIC_KEY)

const STORAGE_KEY = 'absensi_siswa'
let selectedStatus = null

function getWIB() {
    const now = new Date()
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000)
    return new Date(utc + (7 * 3600000))
}

function pad(n) {
    return String(n).padStart(2, '0')
}

function formatDate(d) {
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`
}

function formatDateKey(d) {
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
}

function updateClock() {
    const wib = getWIB()
    document.getElementById('clock').textContent =
        `${pad(wib.getHours())}:${pad(wib.getMinutes())}:${pad(wib.getSeconds())}`
    document.getElementById('date').textContent = formatDate(wib)
}
setInterval(updateClock, 1000)
updateClock()

function getData() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []
    } catch (e) {
        return []
    }
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data))
}

function selectStatus(el) {
    document.querySelectorAll('.status-option').forEach(o => o.classList.remove('selected'))
    el.classList.add('selected')
    selectedStatus = el.dataset.status
}

function showToast(msg, isError = false) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'toast show' + (isError ? ' error' : '')
    clearTimeout(el._timer)
    el._timer = setTimeout(() => el.classList.remove('show'), 3000)
}

async function sendEmail(data) {
    const templateParams = {
        to_email: TARGET_EMAIL,
        email: TARGET_EMAIL,
        name: data.name,
        nama: data.name,
        status: data.status.toUpperCase(),
        tanggal: data.date,
        jam: data.time,
        time: data.time,
        message: `Absensi baru dari ${data.name} - ${data.status.toUpperCase()} pada ${data.date} jam ${data.time} WIB`
    }

    return await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
}

async function submitAbsen() {
    const nama = document.getElementById('nama').value.trim()

    if (!nama) {
        showToast('⚠️ Masukkan nama dulu!', true)
        return
    }

    if (nama.length < 3) {
        showToast('⚠️ Nama minimal 3 karakter!', true)
        return
    }

    if (!selectedStatus) {
        showToast('⚠️ Pilih status kehadiran!', true)
        return
    }

    const wib = getWIB()
    const dateKey = formatDateKey(wib)
    const timeStr = `${pad(wib.getHours())}:${pad(wib.getMinutes())}`

    const data = getData()

    const already = data.find(d => d.name.toLowerCase() === nama.toLowerCase() && d.dateKey === dateKey)
    if (already) {
        showToast('⚠️ Kamu udah absen hari ini!', true)
        return
    }

    const record = {
        name: nama,
        status: selectedStatus,
        dateKey: dateKey,
        date: formatDate(wib),
        time: timeStr,
        timestamp: wib.getTime()
    }

    const loading = document.getElementById('loading')
    const btn = document.getElementById('btnKirim')
    loading.classList.add('show')
    btn.disabled = true

    let emailOk = false

    try {
        await sendEmail(record)
        emailOk = true
    } catch (e) {
        console.error('Email error:', e)
    }

    data.push(record)
    saveData(data)
    renderRecords()

    document.getElementById('nama').value = ''
    document.querySelectorAll('.status-option').forEach(o => o.classList.remove('selected'))
    selectedStatus = null

    loading.classList.remove('show')
    btn.disabled = false

    if (emailOk) {
        showToast('✅ Absensi terkirim ke email!')
    } else {
        showToast('⚠️ Absen tersimpan, tapi email gagal', true)
    }
}

function renderRecords() {
    const wib = getWIB()
    const today = formatDateKey(wib)
    const data = getData().filter(d => d.dateKey === today)

    const container = document.getElementById('records')

    if (data.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div class="icon">📭</div>
                <div class="text">Belum ada yang absen hari ini</div>
            </div>
        `
    } else {
        data.sort((a, b) => a.timestamp - b.timestamp)

        container.innerHTML = data.map(d => `
            <div class="record">
                <div class="left">
                    <div class="avatar">${d.name.charAt(0).toUpperCase()}</div>
                    <div class="info">
                        <div class="name">${escapeHtml(d.name)}</div>
                        <div class="meta">
                            <span class="date">📅 ${d.date}</span>
                            <span class="time">🕐 ${d.time} WIB</span>
                        </div>
                    </div>
                </div>
                <div class="badge ${d.status}">${d.status.toUpperCase()}</div>
            </div>
        `).join('')
    }

    document.getElementById('statHadir').textContent = data.filter(d => d.status === 'hadir').length
    document.getElementById('statIzin').textContent = data.filter(d => d.status === 'izin').length
    document.getElementById('statSakit').textContent = data.filter(d => d.status === 'sakit').length
}

function escapeHtml(text) {
    const div = document.createElement('div')
    div.textContent = text
    return div.innerHTML
}

function exportCSV() {
    const wib = getWIB()
    const today = formatDateKey(wib)
    const data = getData().filter(d => d.dateKey === today)

    if (data.length === 0) {
        showToast('⚠️ Belum ada data!', true)
        return
    }

    let csv = 'Nama,Status,Tanggal,Jam WIB\n'
    data.forEach(d => {
        csv += `"${d.name}","${d.status}","${d.date}","${d.time}"\n`
    })

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `absensi_${today}.csv`
    a.click()
    URL.revokeObjectURL(url)

    showToast('📥 CSV berhasil di-download!')
}

function clearAll() {
    if (!confirm('Yakin mau hapus semua data absensi?')) return
    localStorage.removeItem(STORAGE_KEY)
    renderRecords()
    showToast('🗑️ Data berhasil dihapus!')
}

document.getElementById('nama').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAbsen()
})

renderRecords()
setInterval(renderRecords, 60000)
</script>
</body>
</html>
